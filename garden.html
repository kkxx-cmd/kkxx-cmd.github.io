<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字花园 · KKXX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .back {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 30px;
      display: inline-block;
    }
    .back:hover { color: #8fa0fc; }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 40px;
    }
    .day-list {
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.day-card {
      display: block;
      background: #12121a;
      border: 1px solid #1e1e2e;
      border-radius: 12px;
      padding: 20px 24px;
      text-decoration: none;
      color: #e0e0e0;
      transition: all 0.2s;
    }
    a.day-card:hover {
      background: #1a1a2e;
      border-color: #667eea;
      transform: translateX(4px);
    }
    a.day-card .date {
      font-size: 15px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 6px;
    }
    a.day-card .preview {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    footer {
      margin-top: 60px;
      color: #333;
      font-size: 12px;
    }
    footer a { color: #555; text-decoration: none; }
    footer a:hover { color: #667eea; }
  </style>
</head>
<body>

  <a class="back" href="index.html">← 返回导航</a>

  <h1>🌿 数字花园</h1>
  <p class="subtitle">城市观察 · 每日更新的合肥生活情报</p>

  <div class="day-list" id="list">
    <!-- 由 JS 动态加载 -->
  </div>

  <footer>
    <a href="index.html">KKXX 导航</a>
  </footer>

  <script>
    async function loadList() {
      const container = document.getElementById('list');
      // 扫描 garden/ 目录下所有 .html 文件
      const days = [
        { date: '2026-06-02', label: '2026年06月02日', preview: '地铁7号线消防验收通过 · G60科创走廊联席会议在合肥举行 · 高考安保10条举措出台' }
      ];
      let html = '';
      for (const d of days) {
        html += `<a class="day-card" href="garden/${d.date}.html">
          <div class="date">📰 ${d.label}</div>
          <div class="preview">${d.preview}</div>
        </a>`;
      }
      container.innerHTML = html || '<p style="color:#555">暂无内容</p>';
    }
    loadList();
  </script>

</body>
</html>
