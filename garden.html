<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字花园 · KKXX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .back {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 30px;
      display: inline-block;
    }
    .back:hover { color: #8fa0fc; }
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 40px;
    }
    .garden-feed {
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .news-day {
      background: #12121a;
      border: 1px solid #1e1e2e;
      border-radius: 16px;
      padding: 24px;
    }
    .news-day h2 {
      font-size: 16px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e1e2e;
    }
    .news-day h2 span {
      color: #555;
      font-size: 12px;
      font-weight: 400;
      margin-left: 10px;
    }
    .news-item {
      margin-bottom: 14px;
      padding-left: 12px;
      border-left: 2px solid #2a2a3e;
    }
    .news-item:last-child { margin-bottom: 0; }
    .news-item h3 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      color: #e0e0e0;
    }
    .news-item p {
      font-size: 13px;
      color: #888;
      line-height: 1.6;
    }
    .news-item .tag {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .tag-transport { background: #1a3a2a; color: #4ade80; }
    .tag-tech { background: #1a2a3a; color: #60a5fa; }
    .tag-industry { background: #2a1a3a; color: #a78bfa; }
    .tag-life { background: #2a2a1a; color: #facc15; }
    .tag-other { background: #1a1a2a; color: #94a3b8; }
    footer {
      margin-top: 60px;
      color: #333;
      font-size: 12px;
    }
    footer a { color: #555; text-decoration: none; }
    footer a:hover { color: #667eea; }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #555;
    }
  </style>
</head>
<body>

  <a class="back" href="index.html">← 返回导航</a>

  <h1>🌿 数字花园</h1>
  <p class="subtitle">城市观察 · 每日更新的合肥生活情报</p>

  <div class="garden-feed" id="feed">
    <div class="empty">正在加载...</div>
  </div>

  <footer>
    <a href="index.html">KKXX 导航</a> · 自动更新
  </footer>

  <script>
    // 加载新闻列表
    async function loadNews() {
      const container = document.getElementById('feed');
      try {
        const resp = await fetch('blog/news.html');
        const html = await resp.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const links = doc.querySelectorAll('a[href*="news-202"]');
        if (links.length === 0) {
          container.innerHTML = '<div class="empty">暂无新闻，稍后再来~</div>';
          return;
        }
        let html2 = '<div class="news-day"><h2>📰 新闻列表<span>点击查看详情</span></h2>';
        links.forEach(link => {
          const href = link.getAttribute('href');
          const text = link.textContent.trim();
          html2 += `<div class="news-item"><a href="${href}" style="text-decoration:none;color:inherit"><h3>${text}</h3></a></div>`;
        });
        html2 += '</div>';
        container.innerHTML = html2;
      } catch (e) {
        container.innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>';
      }
    }
    loadNews();
  </script>

</body>
</html>
