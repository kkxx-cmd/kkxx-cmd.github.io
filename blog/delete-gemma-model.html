  <div class="content">
    <p><strong>操作：</strong>删除了 <code>google/gemma-3n-e2b-it</code> 模型及其所属 provider <code>google-custom-integrate-api-nvidia-com</code></p>
    <p><strong>位置：</strong><code>~/.openclaw/agents/main/agent/models.json</code></p>
    <p><strong>效果：</strong>配置中只保留 <code>minimaxai/minimax-m2.7</code> 一个模型，配置更清晰，切换模型时减少干扰。</p>
    <p><strong>教训：</strong>不用的模型及时清理，保持配置精简，也避免误切换。</p>
